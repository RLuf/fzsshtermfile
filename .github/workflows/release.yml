name: Release Obsidian plugin

# Trigger on a version tag that EXACTLY matches manifest.json "version"
# (no leading "v"), e.g. push tag 1.1.0. The release attaches main.js,
# manifest.json and styles.css as individual assets, as required by the
# Obsidian community-plugin submission process.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        # node-pty is an optionalDependency and is bundle-external; skip native
        # build scripts so CI never fails on a native compile.
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes="See CHANGELOG.md for details." \
            main.js manifest.json styles.css
